<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>HumanChessAI</title>
<style>
:root{color-scheme:dark;--bg:#2e2b60;--bar:#342f68;--light:#f2f3e8;--dark:#7ea8d1;--yellow:#f2e84a;--green:#34ef8e;--cyan:#74ddff;--muted:#b8b5d2}
*{box-sizing:border-box}html,body{margin:0;background:#0c0d12;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}button,input{font:inherit}.app{width:min(100vw,720px);min-height:100vh;margin:auto;background:var(--bg)}
header{height:60px;background:var(--bar);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 10px;border-bottom:1px solid #59538a}.player{font-weight:800;font-size:16px}.player:last-child{text-align:right}.title{text-align:center;font-weight:900;font-size:18px;line-height:1.05}.title small{display:block;font-size:11px;color:#dddaf5;margin-top:4px}
.boardWrap{width:100%;aspect-ratio:1;position:relative}.board{position:absolute;inset:0;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);touch-action:none;user-select:none}.sq{display:flex;align-items:center;justify-content:center;position:relative;color:#18191b;font-family:"DejaVu Sans","Noto Sans Symbols 2","Segoe UI Symbol",sans-serif;font-size:clamp(34px,11vw,78px)}.sq.l{background:var(--light)}.sq.d{background:var(--dark)}.sq.sel{box-shadow:inset 0 0 0 4px #ffd930}.sq.last{box-shadow:inset 0 0 0 999px #ffe63a35}.sq.target:after{content:"";position:absolute;width:22%;aspect-ratio:1;border-radius:50%;background:#1117}.sq.capture:after{width:72%;background:transparent;border:4px solid #1116}.piece{pointer-events:none;z-index:2}.coord{position:absolute;font:700 10px monospace;opacity:.55}.file{bottom:3px;right:4px}.rank{top:4px;left:4px}.ghost{position:fixed;pointer-events:none;z-index:50;transform:translate(-50%,-50%);font-size:70px;color:#18191b;filter:drop-shadow(0 5px 5px #0008)}
#arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}.moves{height:32px;overflow-x:auto;white-space:nowrap;padding:5px 7px;color:var(--yellow);font:15px monospace;border-top:1px solid #514d83}.tools{height:58px;display:flex;gap:6px;justify-content:flex-end;align-items:center;padding:5px 8px}.tool{width:46px;height:46px;border:1px solid #5d5990;border-radius:9px;background:linear-gradient(#fafafa,#aaaab3);color:#111;font-size:26px;font-weight:800}.tool.active{background:linear-gradient(#edfff2,#75e5a0)}.tool.nav{color:#6058ff;font-size:34px}.analysis{min-height:230px;padding:4px 8px 20px;color:var(--yellow);font:15px/1.45 monospace}.status{min-height:22px}.status.busy:after{content:" …"}.pv{margin:6px 0;overflow-wrap:anywhere}.pct{color:var(--green);font-weight:900;display:inline-block;min-width:60px}.wdl{color:#cbc7ff;margin-top:9px}.error{color:#ff9f9f}
.shade{display:none;position:fixed;inset:0;background:#0009;z-index:20}.shade.open{display:block}.drawer{width:min(86vw,360px);height:100%;background:#f1f1f1;color:#151515;padding:18px;overflow:auto}.drawer h2{margin:0 0 14px}.drawer label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}.drawer input{width:100%;padding:10px;border:1px solid #aaa;border-radius:6px;background:#fff;color:#111}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.presets button,.drawer .action{border:0;border-radius:6px;padding:10px;background:#d8d8d8;color:#111;font-weight:700}.presets button.on{background:var(--bar);color:#fff}.drawer .action{background:var(--bar);color:#fff;margin-top:16px;margin-right:5px}.modalShade{display:none;position:fixed;inset:0;background:#0009;z-index:25;align-items:center;justify-content:center}.modalShade.open{display:flex}.modal{width:min(88vw,430px);background:#474747;border-radius:28px;padding:20px 0;overflow:hidden}.modal h2{margin:5px 28px 12px}.mode{width:100%;border:0;background:transparent;color:#fff;text-align:left;font-size:19px;padding:17px 28px}.mode.on{background:#fff2}.toast{display:none;position:fixed;z-index:60;left:50%;bottom:18px;transform:translateX(-50%);background:#111e;padding:9px 14px;border-radius:18px}.toast.show{display:block}
</style>
</head>
<body>
<main class="app">
<header><div class="player" id="topPlayer">Black · 1500</div><div class="title">HumanChessAI<small id="sub">Maia3-5M · loading</small></div><div class="player" id="bottomPlayer">White · 1500</div></header>
<div class="boardWrap"><div id="board" class="board"></div><svg id="arrows" viewBox="0 0 800 800"></svg></div>
<div class="moves" id="moves">1. White to move</div>
<div class="tools"><button id="settings" class="tool">⚙</button><button id="analysis" class="tool active">💡</button><button id="flip" class="tool">↻</button><button id="mode" class="tool">M</button><button id="undo" class="tool nav">←</button><button id="redo" class="tool nav">→</button></div>
<section class="analysis"><div id="status" class="status">Loading…</div><div id="pvs"></div><div id="wdl" class="wdl"></div></section>
</main>
<div id="settingsShade" class="shade"><aside class="drawer"><h2>Human analysis settings</h2><label>Analysis speed</label><div class="presets"><button data-preset="fast">Fast</button><button data-preset="balanced">Balanced</button><button data-preset="deep">Deep</button></div><div class="row"><div><label>White Elo</label><input id="whiteElo" type="number" min="0" max="5000"></div><div><label>Black Elo</label><input id="blackElo" type="number" min="0" max="5000"></div></div><div class="row"><div><label>Arrow candidates</label><input id="topN" type="number" min="1" max="8"></div><div><label>PV lines</label><input id="pvCount" type="number" min="1" max="4"></div></div><label>PV length (half-moves)</label><input id="pvPlies" type="number" min="2" max="16"><button id="apply" class="action">Apply</button><button id="closeSettings" class="action">Close</button></aside></div>
<div id="modeShade" class="modalShade"><div class="modal"><h2>Select Game Mode</h2><button class="mode" data-mode="analysis">Analysis Mode</button><button class="mode" data-mode="edit">Edit/re-play Game</button><button class="mode" data-mode="white">Play White</button><button class="mode" data-mode="black">Play Black</button><button class="mode" data-mode="two">Two Players</button><button class="mode" data-mode="cvc">Computer vs Computer</button></div></div>
<div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const glyph={P:'♙',N:'♘',B:'♗',R:'♖',Q:'♕',K:'♔',p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'};
const PRESETS={fast:{top_n:3,pv_count:1,pv_plies:4},balanced:{top_n:4,pv_count:2,pv_plies:8},deep:{top_n:5,pv_count:3,pv_plies:12}};
let data=null, flipped=false, selected=null, analysisOn=true, preds=[], analysisEpoch=0, requestSeq=0, drag=null, busy=false, aiBusy=false;
const pending=new Map();
window.__nativeComplete=(id,status,payload)=>{const p=pending.get(id);if(!p)return;pending.delete(id);let body={};try{body=JSON.parse(payload)}catch(_){body={error:payload}}if(status>=200&&status<300)p.resolve(body);else{const e=new Error(body.error||`Request failed (${status})`);e.status=status;p.reject(e)}};
function api(path,body={}){return new Promise((resolve,reject)=>{const id=`r${Date.now()}_${++requestSeq}`;pending.set(id,{resolve,reject});try{AndroidBridge.request(id,path,body.body||'{}')}catch(e){pending.delete(id);reject(e)}})}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function sideHuman(){if(!data)return false;const t=data.turn,m=data.game_mode;return m==='analysis'||m==='edit'||m==='two'||(m==='white'&&t==='white')||(m==='black'&&t==='black')}
function aiTurn(){if(!data||data.game_over)return false;const m=data.game_mode,t=data.turn;return m==='cvc'||(m==='white'&&t==='black')||(m==='black'&&t==='white')}
function coords(square){const f=square.charCodeAt(0)-97,r=+square[1]-1;const vf=flipped?7-f:f,vr=flipped?r:7-r;return [(vf+.5)*100,(vr+.5)*100]}
function files(){return flipped?'hgfedcba':'abcdefgh'} function ranks(){return flipped?[1,2,3,4,5,6,7,8]:[8,7,6,5,4,3,2,1]}
function legalTargets(from){const s=new Set();(data.legal_moves||[]).forEach(u=>{if(u.slice(0,2)===from)s.add(u.slice(2,4))});return s}
function own(piece){return data.turn==='white'?piece===piece.toUpperCase():piece===piece.toLowerCase()}
function renderBoard(){const b=$('#board');b.innerHTML='';if(!data)return;const fs=files(),rs=ranks(),targets=selected?legalTargets(selected):new Set();const last=data.last_move||'';for(let row=0;row<8;row++)for(let col=0;col<8;col++){const sq=fs[col]+rs[row],piece=data.pieces?.[sq];const el=document.createElement('div');el.className=`sq ${(row+col)%2?'d':'l'}`;el.dataset.square=sq;if(sq===selected)el.classList.add('sel');if(last&&(sq===last.slice(0,2)||sq===last.slice(2,4)))el.classList.add('last');if(targets.has(sq)){el.classList.add('target');if(piece)el.classList.add('capture')}if(piece){const p=document.createElement('span');p.className='piece';p.textContent=glyph[piece];el.appendChild(p)}if(col===0){const c=document.createElement('span');c.className='coord rank';c.textContent=rs[row];el.appendChild(c)}if(row===7){const c=document.createElement('span');c.className='coord file';c.textContent=fs[col];el.appendChild(c)}el.addEventListener('pointerdown',e=>pointerDown(e,el,sq,piece));b.appendChild(el)}drawArrows()}
function drawArrows(){const svg=$('#arrows');svg.innerHTML='';if(!analysisOn||!preds.length)return;const colors=['#00ee70','#716cff','#c8c4ff','#50d8ff','#ffbb55'];preds.slice(0,5).forEach((p,i)=>{const [x1,y1]=coords(p.uci.slice(0,2)),[x2,y2]=coords(p.uci.slice(2,4));const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len,endX=x2-ux*20,endY=y2-uy*20,c=colors[i];const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',x1);line.setAttribute('y1',y1);line.setAttribute('x2',endX);line.setAttribute('y2',endY);line.setAttribute('stroke',c);line.setAttribute('stroke-width',i===0?'10':'7');line.setAttribute('stroke-opacity',i===0?'.9':'.5');line.setAttribute('stroke-linecap','round');svg.appendChild(line);const poly=document.createElementNS('http://www.w3.org/2000/svg','polygon');const px=-uy,py=ux;const pts=[[x2,y2],[endX-ux*18+px*16,endY-uy*18+py*16],[endX-ux*18-px*16,endY-uy*18-py*16]].map(a=>a.join(',')).join(' ');poly.setAttribute('points',pts);poly.setAttribute('fill',c);poly.setAttribute('fill-opacity',i===0?'.9':'.5');svg.appendChild(poly)})}
function renderHeader(){if(!data)return;const s=data.settings||{};$('#topPlayer').textContent=`${flipped?'White':'Black'} · ${flipped?s.white_elo:s.black_elo}`;$('#bottomPlayer').textContent=`${flipped?'Black':'White'} · ${flipped?s.black_elo:s.white_elo}`;$('#sub').textContent=`Maia3-5M · ${data.predictor_ready?'ready':'loading'}`;const sans=data.san_moves||[];let text='';for(let i=0;i<sans.length;i+=2)text+=`${i/2+1}. ${sans[i]||''} ${sans[i+1]||''}  `;$('#moves').textContent=text||`${data.fullmove}. ${data.turn==='white'?'White':'Black'} to move`;$('#undo').disabled=!data.can_undo;$('#redo').disabled=!data.can_redo;$$('.mode').forEach(x=>x.classList.toggle('on',x.dataset.mode===data.game_mode))}
function baseAnalysis(){const st=$('#status');$('#pvs').innerHTML='';$('#wdl').textContent='';if(!analysisOn){st.textContent='Analysis off';return}if(data?.predictor_error){st.className='status error';st.textContent=data.predictor_error;return}if(!data?.predictor_ready){st.className='status busy';st.textContent='Loading Maia model';return}if(data.game_over){st.className='status';st.textContent=`Game over · ${data.result||''}`;return}st.className='status';st.textContent=`${data.fullmove}${data.turn==='black'?'...':'.'} ${data.turn==='white'?'White':'Black'} to move`}
function render(){renderBoard();renderHeader();baseAnalysis();if(analysisOn&&data.predictor_ready&&!data.game_over&&!aiTurn())startAnalysis();else{preds=[];drawArrows();queueAi()}}
async function refresh(){data=await api('/api/state');render()}
async function startAnalysis(){const token=++analysisEpoch,g=data.analysis_generation;const st=$('#status');st.className='status busy';st.textContent='Analyzing human moves';try{const q=await api('/api/predictions',{body:JSON.stringify({generation:g})});if(token!==analysisEpoch||g!==data.analysis_generation)return;preds=q.predictions||[];drawArrows();if(preds[0])$('#wdl').textContent=`W/D/L: ${(preds[0].win*100).toFixed(0)} / ${(preds[0].draw*100).toFixed(0)} / ${(preds[0].loss*100).toFixed(0)}`;const cfg=data.settings||{};const pv=await api('/api/pv',{body:JSON.stringify({generation:g,count:cfg.pv_count||1,plies:cfg.pv_plies||4})});if(token!==analysisEpoch||g!==data.analysis_generation)return;$('#pvs').innerHTML='';(pv.lines||[]).forEach(line=>{const d=document.createElement('div');d.className='pv';d.innerHTML=`<span class="pct">${(line.first_probability*100).toFixed(1)}%</span>${line.moves.map(m=>m.san).join(' ')}`;$('#pvs').appendChild(d)});st.className='status';st.textContent=`${data.fullmove}${data.turn==='black'?'...':'.'} ${data.turn==='white'?'White':'Black'} to move`}catch(e){if(e.status!==409){st.className='status error';st.textContent=e.message}}}
function pointerDown(e,el,sq,piece){if(busy||!sideHuman()||data.game_over)return;drag={id:e.pointerId,el,from:sq,piece,x:e.clientX,y:e.clientY,active:false,ghost:null};try{el.setPointerCapture(e.pointerId)}catch(_){}el.onpointermove=pointerMove;el.onpointerup=pointerUp;el.onpointercancel=pointerCancel}
function pointerMove(e){if(!drag||e.pointerId!==drag.id)return;if(!drag.active&&drag.piece&&own(drag.piece)&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){drag.active=true;selected=drag.from;drag.ghost=document.createElement('div');drag.ghost.className='ghost';drag.ghost.textContent=glyph[drag.piece];document.body.appendChild(drag.ghost);renderBoard()}if(drag.active){e.preventDefault();drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px'}}
async function pointerUp(e){if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;d.ghost?.remove();if(d.active){const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.sq');const to=el?.dataset.square;if(to&&legalTargets(d.from).has(to))await makeMove(d.from,to);else{selected=null;renderBoard()}}else await tapSquare(d.from,d.piece)}function pointerCancel(){drag?.ghost?.remove();drag=null;selected=null;renderBoard()}
async function tapSquare(sq,piece){if(!sideHuman()||busy)return;if(!selected){if(piece&&own(piece)){selected=sq;renderBoard()}return}if(sq===selected){selected=null;renderBoard();return}if(piece&&own(piece)){selected=sq;renderBoard();return}if(legalTargets(selected).has(sq))await makeMove(selected,sq);else{selected=null;renderBoard()}}
async function makeMove(from,to){busy=true;analysisEpoch++;try{data=await api('/api/move',{body:JSON.stringify({from,to})});selected=null;preds=[];render()}catch(e){toast(e.message);selected=null;renderBoard()}finally{busy=false}}
async function action(path){if(busy)return;busy=true;analysisEpoch++;try{data=await api(path,{body:'{}'});selected=null;preds=[];render()}catch(e){toast(e.message)}finally{busy=false}}
async function queueAi(){if(!aiTurn()||aiBusy||!data.predictor_ready)return;aiBusy=true;setTimeout(async()=>{try{data=await api('/api/ai-move',{body:'{}'});preds=[];render()}catch(e){toast(e.message)}finally{aiBusy=false;if(aiTurn())queueAi()}},100)}
function openSettings(){const s=data.settings||{};$('#whiteElo').value=s.white_elo||1500;$('#blackElo').value=s.black_elo||1500;$('#topN').value=s.top_n||3;$('#pvCount').value=s.pv_count||1;$('#pvPlies').value=s.pv_plies||4;syncPreset();$('#settingsShade').classList.add('open')}function closeSettings(){$('#settingsShade').classList.remove('open')}
function presetName(){const n=+$('#topN').value,c=+$('#pvCount').value,p=+$('#pvPlies').value;for(const [k,v] of Object.entries(PRESETS))if(n===v.top_n&&c===v.pv_count&&p===v.pv_plies)return k;return 'custom'}function syncPreset(){$$('.presets button').forEach(b=>b.classList.toggle('on',b.dataset.preset===presetName()))}function setPreset(n){const p=PRESETS[n];$('#topN').value=p.top_n;$('#pvCount').value=p.pv_count;$('#pvPlies').value=p.pv_plies;syncPreset()}
async function applySettings(){busy=true;analysisEpoch++;try{data=await api('/api/settings',{body:JSON.stringify({white_elo:+$('#whiteElo').value,black_elo:+$('#blackElo').value,top_n:+$('#topN').value,pv_count:+$('#pvCount').value,pv_plies:+$('#pvPlies').value,analysis_profile:presetName()})});closeSettings();render()}catch(e){toast(e.message)}finally{busy=false}}
async function setMode(m){$('#modeShade').classList.remove('open');analysisEpoch++;try{data=await api('/api/mode',{body:JSON.stringify({mode:m})});render()}catch(e){toast(e.message)}}
$('#settings').onclick=openSettings;$('#closeSettings').onclick=closeSettings;$('#settingsShade').onclick=e=>{if(e.target.id==='settingsShade')closeSettings()};$('#apply').onclick=applySettings;$$('.presets button').forEach(b=>b.onclick=()=>setPreset(b.dataset.preset));['#topN','#pvCount','#pvPlies'].forEach(x=>$(x).oninput=syncPreset);$('#analysis').onclick=()=>{analysisOn=!analysisOn;$('#analysis').classList.toggle('active',analysisOn);analysisEpoch++;preds=[];render()};$('#flip').onclick=()=>{flipped=!flipped;renderBoard();renderHeader()};$('#mode').onclick=()=>$('#modeShade').classList.add('open');$('#modeShade').onclick=e=>{if(e.target.id==='modeShade')e.currentTarget.classList.remove('open')};$$('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('#undo').onclick=()=>action('/api/undo');$('#redo').onclick=()=>action('/api/redo');
window.nativeBackPressed=()=>{if($('#modeShade').classList.contains('open')){$('#modeShade').classList.remove('open');return true}if($('#settingsShade').classList.contains('open')){closeSettings();return true}return false};window.onNativeModelReady=()=>refresh().catch(()=>{});
refresh().catch(e=>{$('#status').className='status error';$('#status').textContent=e.message});
</script>
</body></html>
