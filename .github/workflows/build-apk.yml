name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/maia23-79-stockfish-eval

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout HumanChessAI
        uses: actions/checkout@v4

      - name: Bundle DroidFish piece sets, toolbar icons and license
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/assets/pieces app/src/main/assets/licenses app/src/main/assets/ui
          sets=(
            chesscases alfonso alpha cburnett chessicons chessmonk freestaunton
            kilfiger leipzig magnetic maya merida merida_new metaltops pirat regular wikimedia
          )
          for set in "${sets[@]}"; do
            url="https://raw.githubusercontent.com/peterosterlund2/droidfish/master/DroidFishApp/src/main/assets/pieces/${set}.zip"
            curl -fL --retry 3 "$url" -o "/tmp/${set}.zip"
            mkdir -p "app/src/main/assets/pieces/${set}"
            unzip -q -j "/tmp/${set}.zip" -d "app/src/main/assets/pieces/${set}"
            test -s "app/src/main/assets/pieces/${set}/wk.svg"
            test -s "app/src/main/assets/pieces/${set}/bp.svg"
          done

          for icon in open_file analyze flip mode left right; do
            curl -fL --retry 3 \
              "https://raw.githubusercontent.com/peterosterlund2/droidfish/master/DroidFishApp/src/main/res/raw/${icon}.svg" \
              -o "app/src/main/assets/ui/${icon}.svg"
            test -s "app/src/main/assets/ui/${icon}.svg"
          done

          curl -fL --retry 3 \
            https://raw.githubusercontent.com/peterosterlund2/droidfish/master/COPYING \
            -o app/src/main/assets/licenses/DROIDFISH_GPLv3.txt

          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              '<button id="settingsBtn" class="tool" aria-label="Settings">⚙</button>':
                  '<button id="settingsBtn" class="tool dfIconButton" aria-label="File"><img class="dfToolbarIcon" src="ui/open_file.svg" alt=""></button>',
              '<button id="analysisBtn" class="tool active" aria-label="Analysis">💡</button>':
                  '<button id="analysisBtn" class="tool active dfIconButton" aria-label="Analysis"><img class="dfToolbarIcon" src="ui/analyze.svg" alt=""></button>',
              '<button id="flipBtn" class="tool" aria-label="Flip board">↻</button>':
                  '<button id="flipBtn" class="tool dfIconButton" aria-label="Flip board"><img class="dfToolbarIcon" src="ui/flip.svg" alt=""></button>',
              '<button id="modeBtn" class="tool" aria-label="Game mode">M</button>':
                  '<button id="modeBtn" class="tool dfIconButton" aria-label="Game mode"><img class="dfToolbarIcon" src="ui/mode.svg" alt=""></button>',
              '<button id="undoBtn" class="tool nav" aria-label="Previous position">←</button>':
                  '<button id="undoBtn" class="tool nav dfIconButton" aria-label="Previous position"><img class="dfToolbarIcon" src="ui/left.svg" alt=""></button>',
              '<button id="redoBtn" class="tool nav" aria-label="Next position">→</button>':
                  '<button id="redoBtn" class="tool nav dfIconButton" aria-label="Next position"><img class="dfToolbarIcon" src="ui/right.svg" alt=""></button>',
              "$('#settingsBtn').onclick=openSettings;":
                  "$('#settingsBtn').onclick=()=>openOverlay('fileShade');",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected UI fragment: {old}')
              s = s.replace(old, new, 1)

          css = '''
          .tools .tool.dfIconButton{
            background:transparent !important;
            border:0 !important;
            border-radius:0 !important;
            box-shadow:none !important;
            padding:0 !important;
            overflow:hidden !important;
          }
          .tools .tool.dfIconButton .dfToolbarIcon{
            display:block !important;
            width:36px !important;
            height:32px !important;
            max-width:none !important;
            max-height:none !important;
            object-fit:fill !important;
            pointer-events:none !important;
          }
          .tools .tool.dfIconButton:disabled .dfToolbarIcon{opacity:.42 !important;}
          '''
          marker = '</style>'
          if marker not in s:
              raise SystemExit('Could not find </style> in index.html')
          s = s.replace(marker, css + '\n' + marker, 1)

          if 'maia_stockfish.css' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="maia_stockfish.css">\n</head>', 1)
          if 'maia_stockfish.js' not in s:
              s = s.replace('</body>', '<script src="maia_stockfish.js"></script>\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

          echo "Bundled piece sets:"
          find app/src/main/assets/pieces -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort
          echo "DroidFish toolbar icons:"
          ls -lh app/src/main/assets/ui/
          grep -F 'maia_stockfish.css' app/src/main/assets/index.html
          grep -F 'maia_stockfish.js' app/src/main/assets/index.html

      - name: Harden pawn promotion selection
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          controller = Path('app/src/main/java/com/humanchessai/app/HumanChessController.kt')
          c = controller.read_text(encoding='utf-8')

          pattern = re.compile(
              r'    private fun playLocked\(from: String, to: String, promotion: String\?, clearRedo: Boolean\) \{.*?\n    \}\n\n    private fun playUciLocked',
              re.S,
          )
          replacement = '''    private fun playLocked(from: String, to: String, promotion: String?, clearRedo: Boolean) {
              val base = from + to
              val promotionRequired = board.legalMoves().any { move ->
                  val uci = board.toUci(move)
                  uci.length >= 5 &&
                      uci.substring(0, 4).equals(base, ignoreCase = true) &&
                      uci[4].lowercaseChar() in "qrbn"
              }
              if (promotionRequired && promotion == null) {
                  throw IllegalArgumentException("Choose a promotion piece")
              }

              val raw = base + (promotion ?: "")
              val match = legalMoveByUci(board, raw)
                  ?: throw IllegalArgumentException("Illegal move")
              val uci = board.toUci(match)
              board.doMove(match)
              moveHistory.add(uci)
              if (clearRedo) redoHistory.clear()
          }

          private fun playUciLocked'''
          c2, count = pattern.subn(replacement, c, count=1)
          if count != 1:
              raise SystemExit(f'Expected one playLocked block, replaced {count}')
          controller.write_text(c2, encoding='utf-8')

          activity = Path('app/src/main/java/com/humanchessai/app/MainActivity.kt')
          a = activity.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing {label}')
              return text.replace(old, new, 1)

          a = replace_once(
              a,
              '.hcaPromotionItem {',
              '.hcaPromotionItem {\n              pointer-events: none !important;',
              'promotion item CSS',
          )
          a = replace_once(
              a,
              '.hcaPromotionItem:last-child { border-bottom: 0 !important; }',
              '#hcaPromotionShade.open.ready .hcaPromotionItem { pointer-events: auto !important; }\n            .hcaPromotionItem:last-child { border-bottom: 0 !important; }',
              'promotion ready CSS',
          )
          a = replace_once(
              a,
              'var promotionResolver = null;',
              'var promotionResolver = null;\n          var promotionOpenedAt = 0;\n          var promotionReadyTimer = null;',
              'promotion resolver',
          )
          a = replace_once(
              a,
              "promotionShade.classList.remove('open');",
              "promotionShade.classList.remove('open');\n            promotionShade.classList.remove('ready');\n            if (promotionReadyTimer) { clearTimeout(promotionReadyTimer); promotionReadyTimer = null; }",
              'promotion close handler',
          )
          a = replace_once(
              a,
              'btn.onclick = function() { closePromotion(entry[0]); };',
              '''btn.onclick = function(ev) {
                  if (performance.now() - promotionOpenedAt < 300) {
                    if (ev) { ev.preventDefault(); ev.stopPropagation(); }
                    return;
                  }
                  closePromotion(entry[0]);
                };''',
              'promotion button handler',
          )
          a = replace_once(
              a,
              "promotionShade.classList.add('open');",
              "promotionOpenedAt = performance.now();\n              promotionShade.classList.remove('ready');\n              promotionShade.classList.add('open');\n              promotionReadyTimer = setTimeout(function() {\n                promotionReadyTimer = null;\n                if (promotionShade.classList.contains('open')) promotionShade.classList.add('ready');\n              }, 300);",
              'promotion open handler',
          )
          a = replace_once(
              a,
              "if (e.target === promotionShade) closePromotion(null);",
              "if (performance.now() - promotionOpenedAt < 300) { e.preventDefault(); e.stopPropagation(); return; }\n            if (e.target === promotionShade) closePromotion(null);",
              'promotion shade click handler',
          )

          activity.write_text(a, encoding='utf-8')
          PY

          grep -F 'throw IllegalArgumentException("Choose a promotion piece")' app/src/main/java/com/humanchessai/app/HumanChessController.kt
          grep -F "promotionShade.classList.add('ready')" app/src/main/java/com/humanchessai/app/MainActivity.kt
          grep -F 'pointer-events: none !important' app/src/main/java/com/humanchessai/app/MainActivity.kt

      - name: Route Stockfish evaluation off the control thread
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/humanchessai/app/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          old = '''            path == "/api/predictions" ||
            path == "/api/pv" ||'''
          new = '''            path == "/api/predictions" ||
            path == "/api/stockfish" ||
            path == "/api/pv" ||'''
          if old not in s:
              raise SystemExit('Could not locate NativeBridge AI executor routes')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          grep -F 'path == "/api/stockfish"' app/src/main/java/com/humanchessai/app/MainActivity.kt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Maia exporter dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install onnx onnxscript
          git clone https://github.com/CSSLab/maia3.git .ci/maia3
          git -C .ci/maia3 checkout 1e13597c42d4858b7cfd7cfdae01e297263364b2
          python -m pip install -e .ci/maia3

      - name: Export Maia3 5M, 23M and 79M ONNX models
        shell: bash
        run: |
          set -euxo pipefail
          for model in maia3-5m maia3-23m maia3-79m; do
            python tools/export_maia_onnx.py --model "$model" --output-dir app/src/main/assets/models
          done

          echo "Generated model assets:"
          ls -lh app/src/main/assets/models/
          for model in maia3-5m maia3-23m maia3-79m; do
            test -s "app/src/main/assets/models/${model}.onnx"
            test -s "app/src/main/assets/models/${model}.onnx.data"
          done

      - name: Bundle official Stockfish 19 Android arm64
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/licenses /tmp/stockfish19
          curl -fL --retry 3 \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-android-arm64-universal.tar.gz \
            -o /tmp/stockfish19.tar.gz
          tar -xzf /tmp/stockfish19.tar.gz -C /tmp/stockfish19
          SF_BIN="$(find /tmp/stockfish19 -type f -name 'stockfish-android-arm64*' | head -n 1)"
          test -n "$SF_BIN"
          cp "$SF_BIN" app/src/main/jniLibs/arm64-v8a/libstockfish.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libstockfish.so
          test -s app/src/main/jniLibs/arm64-v8a/libstockfish.so
          file app/src/main/jniLibs/arm64-v8a/libstockfish.so

          curl -fL --retry 3 \
            https://raw.githubusercontent.com/official-stockfish/Stockfish/sf_19/Copying.txt \
            -o app/src/main/assets/licenses/STOCKFISH_GPLv3.txt
          test -s app/src/main/assets/licenses/STOCKFISH_GPLv3.txt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --stacktrace :app:assembleDebug

      - name: Show APK information
        shell: bash
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HumanChessAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent GitHub APK download
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk HumanChessAI.apk

          if gh release view latest-beta >/dev/null 2>&1; then
            gh release upload latest-beta HumanChessAI.apk --clobber
            gh release edit latest-beta \
              --title "HumanChessAI — Latest Build" \
              --notes "Latest installable Android build from the main branch. Includes Maia3 5M/23M/79M human-like move prediction and Stockfish 19 position evaluation. Source code is available in this repository."
          else
            gh release create latest-beta HumanChessAI.apk \
              --target "$GITHUB_SHA" \
              --title "HumanChessAI — Latest Build" \
              --notes "Latest installable Android build from the main branch. Includes Maia3 5M/23M/79M human-like move prediction and Stockfish 19 position evaluation. Source code is available in this repository."
          fi

          echo "Permanent APK URL:"
          echo "https://github.com/BALAJI56237/HumanChessAI/releases/download/latest-beta/HumanChessAI.apk"
